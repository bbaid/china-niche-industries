<script>
const COLORS = {
  "Textiles & apparel": "#4e79a7",
  "Accessories & small goods": "#f28e2b",
  "Toys & seasonal goods": "#e15759",
  "Arts & crafts": "#76b7b2",
  "Musical instruments": "#59a14f",
  "Jewelry & gems": "#edc948",
  "Beauty & hair": "#b07aa1",
  "Hardware & industrial": "#9c755f",
  "Furniture & home": "#ff9da7",
  "Sports & outdoors": "#17becf",
  "Agriculture & food": "#8cd17d",
};

const features = window.CLUSTERS.features;
const active = new Set(Object.keys(COLORS));
const darkQuery = matchMedia("(prefers-color-scheme: dark)");

const map = L.map("map", { zoomControl: true }).setView([31, 112], 5);
let basemap;
function setBasemap() {  // follow the OS light/dark setting, including live switches
  const canvas = darkQuery.matches ? "World_Dark_Gray_Base" : "World_Light_Gray_Base";
  basemap?.remove();
  basemap = L.tileLayer(`https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/${canvas}/MapServer/tile/{z}/{y}/{x}`, {
    maxZoom: 16,
    attribution: "Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ",
  }).addTo(map);
}
setBasemap();
darkQuery.addEventListener("change", setBasemap);

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function popupHtml(p) {
  const q = encodeURIComponent(p.search_zh);
  return `<div class="pop-ind">${esc(p.industry)}</div>
    <div class="pop-place">${esc(p.place_en)} · ${esc(p.place_zh)}<br>${esc(p.city_en)}, ${esc(p.province)}</div>
    <div class="pop-claim">${esc(p.claim)}</div>
    <div class="pop-meta">${esc(p.category)} · ${esc(p.level)}<br>
      Verify: <a href="https://www.baidu.com/s?wd=${q}" target="_blank" rel="noopener">Baidu “${esc(p.search_zh)}”</a></div>`;
}

const markers = new Map();
for (const f of features) {
  const p = f.properties;
  const [lon, lat] = f.geometry.coordinates;
  const m = L.circleMarker([lat, lon], {
    radius: 7, weight: 1.5, color: "#fff", fillColor: COLORS[p.category], fillOpacity: 0.9,
  }).bindPopup(popupHtml(p)).bindTooltip(p.industry, { direction: "top", offset: [0, -6] });
  markers.set(p.id, m);
}
// Fit all points; re-fit if the container resizes, until the user moves the map themselves.
const allBounds = L.featureGroup([...markers.values()]).getBounds();
let userMoved = false;
const fitAll = () => userMoved || map.fitBounds(allBounds, { padding: [20, 20], animate: false });
for (const ev of ["mousedown", "touchstart", "wheel"]) {
  map.getContainer().addEventListener(ev, () => { userMoved = true; }, { once: true, passive: true });
}
fitAll();
new ResizeObserver(() => { map.invalidateSize(); fitAll(); }).observe(map.getContainer());

const chips = document.getElementById("chips");
for (const [cat, color] of Object.entries(COLORS)) {
  const b = document.createElement("button");
  b.className = "chip";
  b.setAttribute("aria-pressed", "true");
  b.innerHTML = `<span class="dot" style="background:${color}"></span>${esc(cat)}`;
  b.onclick = () => {
    active.has(cat) ? active.delete(cat) : active.add(cat);
    b.setAttribute("aria-pressed", active.has(cat));
    render();
  };
  b.ondblclick = () => {  // double-click a chip to show only that category
    active.clear(); active.add(cat);
    chips.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", c === b));
    render();
  };
  chips.appendChild(b);
}

const list = document.getElementById("list");
const search = document.getElementById("q");
search.oninput = render;

function render() {
  const q = search.value.trim().toLowerCase();
  const shown = features.filter(f => {
    const p = f.properties;
    if (!active.has(p.category)) return false;
    if (!q) return true;
    return [p.industry, p.place_en, p.place_zh, p.city_en, p.city_zh, p.province, p.category, p.search_zh]
      .some(v => v.toLowerCase().includes(q));
  }).sort((a, b) => a.properties.industry.localeCompare(b.properties.industry));

  const ids = new Set(shown.map(f => f.properties.id));
  for (const [id, m] of markers) ids.has(id) ? m.addTo(map) : m.remove();

  list.innerHTML = "";
  for (const f of shown) {
    const p = f.properties;
    const li = document.createElement("li");
    li.innerHTML = `<span class="dot" style="background:${COLORS[p.category]}"></span>
      <div><b>${esc(p.industry)}</b><span>${esc(p.place_en)} ${esc(p.place_zh)} · ${esc(p.province)}</span></div>`;
    li.onclick = () => {
      const [lon, lat] = f.geometry.coordinates;
      map.flyTo([lat, lon], 10, { duration: 0.8 });
      markers.get(p.id).openPopup();
      list.querySelectorAll("li.active").forEach(x => x.classList.remove("active"));
      li.classList.add("active");
      if (innerWidth <= 760) scrollTo({ top: 0, behavior: "smooth" });
    };
    list.appendChild(li);
  }
  document.getElementById("count").textContent = `${shown.length} of ${features.length} clusters`;
}
render();
</script>
